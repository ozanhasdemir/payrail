[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
arc = "${ARC_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
arc = { key = "", url = "https://testnet.arcscan.app/api/", chain = 5042002 }
